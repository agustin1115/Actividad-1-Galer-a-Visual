<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 470" role="img"
  aria-label="Mapa del recorrido: desde la página de Inicio, los 5 puntos de interés conectados en orden, hasta el cierre con Sumate">

  <title>Mapa del recorrido &#183; Techo para Argentina</title>

  <defs>
    <style>
      .titulo-mapa { font-family: 'Trebuchet MS', Verdana, sans-serif; font-weight: bold; fill: #01579b; }
      .subtitulo-mapa { font-family: Arial, Helvetica, sans-serif; fill: #555555; }
      .num-tag { font-family: 'Trebuchet MS', Verdana, sans-serif; font-weight: bold; fill: #ef6c00;
                 letter-spacing: 1px; text-transform: uppercase; }
      .bookend-tag { font-family: 'Trebuchet MS', Verdana, sans-serif; font-weight: bold; fill: #01579b;
                 letter-spacing: 0.5px; text-transform: uppercase; }
      .stop-title { font-family: 'Trebuchet MS', Verdana, sans-serif; font-weight: bold; fill: #222222; }
      .stop-desc { font-family: Arial, Helvetica, sans-serif; fill: #555555; }
      .icon-stroke { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1250" height="470" fill="#f2f8fb" rx="14" />

  <text x="625" y="42" text-anchor="middle" class="titulo-mapa" font-size="26">Un recorrido por TECHO</text>
  <text x="625" y="66" text-anchor="middle" class="subtitulo-mapa" font-size="15">
    De la home a los 5 puntos de interés, hasta la invitación a sumarse
  </text>

  <!-- Camino: Inicio -> 5 puntos de interés -> Sumate -->
  <path d="M90,230 C180,230 180,150 270,150 C360,150 360,230 450,230 C540,230 540,150 630,150 C720,150 720,230 810,230 C900,230 900,150 990,150 C1065,150 1065,190 1140,190"
    fill="none" stroke="#4fc3f7" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round" />

  <!-- Inicio (home) -->
  <g transform="translate(90,230)">
    <text x="0" y="-58" text-anchor="middle" class="bookend-tag" font-size="11">Punto de partida</text>
    <circle r="32" fill="#01579b" stroke="#ffffff" stroke-width="4" />
    <path class="icon-stroke" d="M0,-13 C6,-13 10,-8.5 10,-2.5 C10,5.5 0,15 0,15 C0,15 -10,5.5 -10,-2.5 C-10,-8.5 -6,-13 0,-13 Z" />
    <circle cx="0" cy="-2.5" r="3" fill="#01579b" stroke="none" />
    <text x="0" y="60" text-anchor="middle" class="stop-title" font-size="14">Inicio</text>
    <text x="0" y="76" text-anchor="middle" class="stop-desc" font-size="12">Equipo + presentación</text>
    <text x="0" y="92" text-anchor="middle" class="stop-desc" font-size="12">+ este mapa</text>
  </g>

  <!-- Parada 1: Vivienda de emergencia -->
  <g transform="translate(270,150)">
    <text x="0" y="-56" text-anchor="middle" class="num-tag" font-size="12">1 de 5</text>
    <circle r="34" fill="#0288d1" stroke="#ffffff" stroke-width="4" />
    <path class="icon-stroke" d="M-14,6 L-14,-4 L0,-16 L14,-4 L14,6 Z M-6,6 L-6,-2 L6,-2 L6,6" />
    <text x="0" y="62" text-anchor="middle" class="stop-title" font-size="14">Vivienda de</text>
    <text x="0" y="78" text-anchor="middle" class="stop-title" font-size="14">emergencia</text>
    <text x="0" y="98" text-anchor="middle" class="stop-desc" font-size="12">La urgencia resuelta</text>
  </g>

  <!-- Parada 2: Infraestructura comunitaria -->
  <g transform="translate(450,230)">
    <text x="0" y="-56" text-anchor="middle" class="num-tag" font-size="12">2 de 5</text>
    <circle r="34" fill="#0288d1" stroke="#ffffff" stroke-width="4" />
    <rect class="icon-stroke" x="-15" y="-4" width="9" height="9" />
    <rect class="icon-stroke" x="-4.5" y="-4" width="9" height="9" />
    <rect class="icon-stroke" x="6" y="-4" width="9" height="9" />
    <text x="0" y="62" text-anchor="middle" class="stop-title" font-size="14">Infraestructura</text>
    <text x="0" y="78" text-anchor="middle" class="stop-title" font-size="14">comunitaria</text>
    <text x="0" y="98" text-anchor="middle" class="stop-desc" font-size="12">El barrio mejora</text>
  </g>

  <!-- Parada 3: Vivienda progresiva -->
  <g transform="translate(630,150)">
    <text x="0" y="-56" text-anchor="middle" class="num-tag" font-size="12">3 de 5</text>
    <circle r="34" fill="#0288d1" stroke="#ffffff" stroke-width="4" />
    <path class="icon-stroke" d="M-15,6 L-15,-3 L-3,-14 L9,-3 L9,6 Z M-9,6 L-9,-1 L3,-1 L3,6" />
    <path class="icon-stroke" d="M13,-10 L13,2 M7,-4 L19,-4" />
    <text x="0" y="62" text-anchor="middle" class="stop-title" font-size="14">Vivienda</text>
    <text x="0" y="78" text-anchor="middle" class="stop-title" font-size="14">progresiva</text>
    <text x="0" y="98" text-anchor="middle" class="stop-desc" font-size="12">La casa crece</text>
  </g>

  <!-- Parada 4: Eventos -->
  <g transform="translate(810,230)">
    <text x="0" y="-56" text-anchor="middle" class="num-tag" font-size="12">4 de 5</text>
    <circle r="34" fill="#0288d1" stroke="#ffffff" stroke-width="4" />
    <path class="icon-stroke"
      d="M0,-16 L4.5,-5.5 L16,-4.5 L7.5,3 L10,14.5 L0,8.5 L-10,14.5 L-7.5,3 L-16,-4.5 L-4.5,-5.5 Z" />
    <text x="0" y="62" text-anchor="middle" class="stop-title" font-size="14">Eventos</text>
    <text x="0" y="78" text-anchor="middle" class="stop-desc" font-size="12">Día de la Niñez</text>
    <text x="0" y="98" text-anchor="middle" class="stop-desc" font-size="12">El vínculo se sostiene</text>
  </g>

  <!-- Parada 5: Colectas -->
  <g transform="translate(990,150)">
    <text x="0" y="-56" text-anchor="middle" class="num-tag" font-size="12">5 de 5</text>
    <circle r="34" fill="#0288d1" stroke="#ffffff" stroke-width="4" />
    <rect class="icon-stroke" x="-13" y="-6" width="26" height="18" rx="1" />
    <path class="icon-stroke" d="M-13,-1 L13,-1 M0,-6 L0,12 M-13,-6 L-7,-13 L7,-13 L13,-6" />
    <text x="0" y="62" text-anchor="middle" class="stop-title" font-size="14">Colectas</text>
    <text x="0" y="78" text-anchor="middle" class="stop-desc" font-size="12">Ropa, juguetes,</text>
    <text x="0" y="94" text-anchor="middle" class="stop-desc" font-size="12">pañales</text>
  </g>

  <!-- Cierre: Sumate -->
  <g transform="translate(1140,190)">
    <text x="0" y="-52" text-anchor="middle" class="bookend-tag" font-size="11" fill="#ef6c00">Cierre</text>
    <circle r="30" fill="#ef6c00" stroke="#ffffff" stroke-width="4" />
    <path class="icon-stroke" d="M-9,0 L9,0 M2,-8 L10,0 L2,8" />
    <text x="0" y="56" text-anchor="middle" class="stop-title" font-size="13" fill="#ef6c00">¡Sumate!</text>
  </g>
</svg>
